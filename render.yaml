services:
  # Development-only controlled prover. The image is pinned to the Midnight
  # compatibility-matrix version; it exposes Render-managed HTTPS health
  # endpoints used by the API readiness probe.
  - type: web
    name: lunarveil-proof-server
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/midnightntwrk/proof-server:8.1.0
    healthCheckPath: /health
    envVars:
      - key: MIDNIGHT_PROOF_SERVER_PORT
        value: 10000

  - type: web
    name: lunarveil-web-preview
    runtime: node
    plan: free
    buildCommand: npm ci && NITRO_PRESET=node npm --workspace @lunarveil/web run build
    startCommand: node apps/web/.output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: LUNARVEIL_API_BASE_URL
        sync: false

  - type: web
    name: lunarveil-api-preview
    runtime: node
    plan: free
    buildCommand: npm ci && npm --workspace @lunarveil/db exec prisma -- migrate deploy --schema prisma/schema.prisma && npm --workspace @lunarveil/api-server run typecheck
    startCommand: npm --workspace @lunarveil/api-server run start
    healthCheckPath: /v1/system/status
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: LUNARVEIL_ENV
        value: development
      - key: LUNARVEIL_API_HOST
        value: 0.0.0.0
      # Public read-only Midnight Preview indexer. The API probe queries only
      # the chain tip; it never sends orders, witnesses, or wallet material.
      - key: LUNARVEIL_INDEXER_URL
        value: https://indexer.preview.midnight.network/api/v4/graphql
      - key: LUNARVEIL_PROVER_URL
        value: https://lunarveil-proof-server.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: LUNARVEIL_DATABASE_URL
        sync: false
      - key: LUNARVEIL_TRADER_TAG_KEY
        sync: false
      - key: LUNARVEIL_ALLOWED_ORIGINS
        sync: false
